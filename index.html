<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars</title>
    <style>
        .car {
            margin-bottom: 20px;
        }
        .car img {
            max-width: 100%;
            height: auto;
        }
        .car-specs {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Cars</h1>
    
    <div class="car">
        <h2>Car Model 1</h2>
        <img src="car1.jpg" alt="Car Model 1">
        <div class="car-specs">
            <p>Engine: V8</p>
            <p>Horsepower: 450 HP</p>
            <p>Top Speed: 200 mph</p>
        </div>
    </div>
    
    <div class="car">
        <h2>Car Model 2</h2>
        <img src="car2.jpg" alt="Car Model 2">
        <div class="car-specs">
            <p>Engine: V6</p>
            <p>Horsepower: 350 HP</p>
            <p>Top Speed: 180 mph</p>
        </div>
    </div>
    
    <div class="car">
        <h2>Car Model 3</h2>
        <img src="car3.jpg" alt="Car Model 3">
        <div class="car-specs">
            <p>Engine: Electric</p>
            <p>Horsepower: 500 HP</p>
            <p>Top Speed: 220 mph</p>
        </div>
    </div>
    
</body>
</html>
